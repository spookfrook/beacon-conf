<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Código - SecureBox</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F9FAFB;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* Background gradient effect */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(168, 85, 247, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 480px;
            width: 100%;
            padding: 48px;
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 48px;
        }
        
        .icon {
            width: 80px;
            height: 80px;
            background: #692494;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            color: white;
        }
        
        h1 {
            color: #111827;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: #6B7280;
            font-size: 16px;
            font-weight: 400;
        }
        
        .instruction {
            text-align: center;
            margin-bottom: 32px;
            color: #374151;
            line-height: 1.6;
        }
        
        .pin-inputs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 32px;
        }
        
        .pin-input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            transition: all 0.2s;
            color: #111827;
        }
        
        .pin-input:hover {
            border-color: #D1D5DB;
        }
        
        .pin-input:focus {
            outline: none;
            border-color: #692494;
            box-shadow: 0 0 0 3px rgba(105, 36, 148, 0.1);
        }
        
        .pin-input.filled {
            border-color: #692494;
            background: #F3E8FF;
        }
        
        .verify-btn {
            width: 100%;
            padding: 12px 24px;
            background: #692494;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .verify-btn:hover {
            background: #5a1f7a;
        }
        
        .verify-btn:disabled {
            background: #E5E7EB;
            color: #9CA3AF;
            cursor: not-allowed;
        }
        
        .resend-section {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #6B7280;
        }
        
        .resend-btn {
            color: #692494;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font-size: 14px;
        }
        
        .resend-btn:hover {
            text-decoration: underline;
        }
        
        .resend-btn:disabled {
            color: #9CA3AF;
            cursor: not-allowed;
            text-decoration: none;
        }
        
        .error-message {
            display: none;
            padding: 12px 16px;
            background: #FEE2E2;
            color: #DC2626;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }
        
        .success-message {
            display: none;
            padding: 12px 16px;
            background: #D1FAE5;
            color: #065F46;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 32px;
            color: #6B7280;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-link:hover {
            color: #7C3AED;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">✉️</div>
            <h1>Verificar Email</h1>
            <p class="subtitle">Digite o código de 6 dígitos</p>
        </div>
        
        <p class="instruction">
            Enviamos um código de verificação para seu email.<br>
            Digite o código abaixo para continuar.
        </p>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <form id="pinForm">
            <div class="pin-inputs" id="pinInputs">
                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
            </div>
            
            <button type="submit" class="verify-btn" id="verifyBtn" disabled>Verificar código</button>
        </form>
        
        <div class="resend-section">
            Não recebeu o código? 
            <button class="resend-btn" id="resendBtn">Enviar novamente</button>
        </div>
        
        <a href="/" class="back-link">← Voltar ao início</a>
    </div>
    
    <script>
        const verificationId = sessionStorage.getItem('verification_id');
        const userEmail = sessionStorage.getItem('user_email');
        
        if (!verificationId) {
            window.location.href = '/';
        }
        
        const inputs = document.querySelectorAll('.pin-input');
        const verifyBtn = document.getElementById('verifyBtn');
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');
        
        // Auto-focus first input
        inputs[0].focus();
        
        // Handle input
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                
                if (value.length === 1 && /[0-9]/.test(value)) {
                    input.classList.add('filled');
                    // Move to next input
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                } else {
                    input.value = '';
                    input.classList.remove('filled');
                }
                
                // Check if all inputs are filled
                const pin = Array.from(inputs).map(i => i.value).join('');
                verifyBtn.disabled = pin.length !== 6;
            });
            
            // Handle backspace
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            
            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text');
                const digits = pastedData.replace(/\D/g, '').slice(0, 6);
                
                digits.split('').forEach((digit, i) => {
                    if (inputs[i]) {
                        inputs[i].value = digit;
                        inputs[i].classList.add('filled');
                    }
                });
                
                const lastIndex = Math.min(digits.length, 6) - 1;
                if (inputs[lastIndex]) {
                    inputs[lastIndex].focus();
                }
                
                verifyBtn.disabled = digits.length !== 6;
            });
        });
        
        // Handle form submission
        document.getElementById('pinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const pin = Array.from(inputs).map(i => i.value).join('');
            
            if (pin.length !== 6) return;
            
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verificando...';
            errorMsg.style.display = 'none';
            
            try {
                const response = await fetch('/verify-pin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `verification_id=${encodeURIComponent(verificationId)}&pin=${encodeURIComponent(pin)}`
                });
                
                if (response.ok) {
                    const data = await response.json();
                    sessionStorage.setItem('upload_token', data.token);
                    sessionStorage.removeItem('verification_id');
                    sessionStorage.removeItem('user_email');
                    
                    successMsg.textContent = 'Verificado com sucesso! Redirecionando...';
                    successMsg.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = '/upload';
                    }, 1000);
                } else {
                    const error = await response.json();
                    errorMsg.textContent = error.detail;
                    errorMsg.style.display = 'block';
                    
                    // Clear inputs on error
                    inputs.forEach(input => {
                        input.value = '';
                        input.classList.remove('filled');
                    });
                    inputs[0].focus();
                }
            } catch (error) {
                errorMsg.textContent = 'Erro ao verificar código. Tente novamente.';
                errorMsg.style.display = 'block';
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verificar código';
            }
        });
        
        // Handle resend
        document.getElementById('resendBtn').addEventListener('click', async () => {
            if (!userEmail) return;
            
            const resendBtn = document.getElementById('resendBtn');
            resendBtn.disabled = true;
            resendBtn.textContent = 'Enviando...';
            
            try {
                const response = await fetch('/validate-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `email=${encodeURIComponent(userEmail)}`
                });
                
                if (response.ok) {
                    const data = await response.json();
                    sessionStorage.setItem('verification_id', data.verification_id);
                    
                    successMsg.textContent = 'Novo código enviado!';
                    successMsg.style.display = 'block';
                    
                    // Clear inputs
                    inputs.forEach(input => {
                        input.value = '';
                        input.classList.remove('filled');
                    });
                    inputs[0].focus();
                    
                    // Disable resend for 60 seconds
                    let countdown = 60;
                    const interval = setInterval(() => {
                        countdown--;
                        resendBtn.textContent = `Aguarde ${countdown}s`;
                        
                        if (countdown === 0) {
                            clearInterval(interval);
                            resendBtn.disabled = false;
                            resendBtn.textContent = 'Enviar novamente';
                        }
                    }, 1000);
                }
            } catch (error) {
                errorMsg.textContent = 'Erro ao enviar código. Tente novamente.';
                errorMsg.style.display = 'block';
                resendBtn.disabled = false;
                resendBtn.textContent = 'Enviar novamente';
            }
        });
    </script>
</body>
</html>
