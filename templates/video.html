<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Loop Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        
        .tap-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 10;
        }
        
        .tap-zone-left {
            left: 0;
            width: 25%;
        }
        
        .tap-zone-right {
            right: 0;
            width: 25%;
        }
        
        .tap-zone-bottom {
            position: absolute;
            bottom: 0;
            left: 25%;
            right: 25%;
            height: 20%;
            z-index: 11;
        }
        
        .tap-zone-center {
            position: absolute;
            top: 20%;
            bottom: 20%;
            left: 25%;
            right: 25%;
            z-index: 9;
        }
        
        .paused-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        
        .paused-indicator::before,
        .paused-indicator::after {
            content: '';
            width: 12px;
            height: 40px;
            background: white;
            margin: 0 8px;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            display: none;
        }
        
    </style>
</head>
<body>
    <div class="video-container" id="videoContainer">
        <div class="tap-zone tap-zone-left" id="leftZone"></div>
        <div class="tap-zone tap-zone-right" id="rightZone"></div>
        <div class="tap-zone tap-zone-bottom" id="bottomZone"></div>
        <div class="tap-zone tap-zone-center" id="centerZone"></div>
        <video id="videoPlayer" autoplay></video>
        <div class="loading" id="loading">Loading...</div>
        <div class="paused-indicator" id="pausedIndicator"></div>
    </div>
    
    <script>
        const mainVideos = [
            'https://res.cloudinary.com/dsbzveh0y/video/upload/v1758064168/1_mnpbuc.mp4',
            'https://res.cloudinary.com/dsbzveh0y/video/upload/v1758064165/2_mexsbf.mov',
            'https://res.cloudinary.com/dsbzveh0y/video/upload/v1758064164/4_cehsv0.mov',
            'https://res.cloudinary.com/dsbzveh0y/video/upload/v1758064163/3_r9pdtc.mov',
            'https://res.cloudinary.com/dsbzveh0y/video/upload/v1758662942/5_r42lsu.mov',
            'https://res.cloudinary.com/dsbzveh0y/video/upload/v1760014766/6_zvr36c.mov'
        ];
        
        const infoVideo = 'https://res.cloudinary.com/dsbzveh0y/video/upload/v1758064160/INFO_wrvcfd.mp4';
        
        let currentMainVideoIndex = 0;
        let skippedInfoLastTime = false;
        let currentVideoUrl = '';
        const videoPlayer = document.getElementById('videoPlayer');
        const videoContainer = document.getElementById('videoContainer');
        const loading = document.getElementById('loading');
        const leftZone = document.getElementById('leftZone');
        const rightZone = document.getElementById('rightZone');
        const bottomZone = document.getElementById('bottomZone');
        const centerZone = document.getElementById('centerZone');
        const pausedIndicator = document.getElementById('pausedIndicator');
        let isPlaying = true;
        
        function loadVideo(url) {
            loading.style.display = 'block';
            currentVideoUrl = url;
            videoPlayer.src = url;
            videoPlayer.load();
        }
        
        function shouldPlayInfoVideo() {
            // Always play if skipped last time
            if (skippedInfoLastTime) {
                return true;
            }
            // Otherwise 66% chance
            return Math.random() < 0.66;
        }
        
        function getNextVideoUrl() {
            // If current video is info video, play next main video
            if (currentVideoUrl === infoVideo) {
                const url = mainVideos[currentMainVideoIndex];
                currentMainVideoIndex = (currentMainVideoIndex + 1) % mainVideos.length;
                skippedInfoLastTime = false;
                return url;
            }
            
            // Otherwise, decide whether to play info video
            if (shouldPlayInfoVideo()) {
                skippedInfoLastTime = false;
                return infoVideo;
            } else {
                // Play next main video
                skippedInfoLastTime = true;
                const url = mainVideos[currentMainVideoIndex];
                currentMainVideoIndex = (currentMainVideoIndex + 1) % mainVideos.length;
                return url;
            }
        }
        
        function playNextVideo() {
            const nextUrl = getNextVideoUrl();
            loadVideo(nextUrl);
        }
        
        function playPreviousVideo() {
            // For previous, just go back in main videos
            currentMainVideoIndex = (currentMainVideoIndex - 1 + mainVideos.length) % mainVideos.length;
            loadVideo(mainVideos[currentMainVideoIndex]);
        }
        
        // Initialize first video
        loadVideo(mainVideos[currentMainVideoIndex]);
        
        // Handle video events
        videoPlayer.addEventListener('loadeddata', () => {
            loading.style.display = 'none';
            if (isPlaying) {
                videoPlayer.play().catch(e => {
                    console.error('Auto-play failed:', e);
                    // If autoplay fails, wait for user interaction
                });
            }
        });
        
        videoPlayer.addEventListener('ended', () => {
            if (isPlaying) {
                playNextVideo();
            }
        });
        
        videoPlayer.addEventListener('error', (e) => {
            console.error('Video error:', e);
            // Try next video on error
            playNextVideo();
        });
        
        // Handle left zone tap - go to previous video
        leftZone.addEventListener('click', (e) => {
            e.stopPropagation();
            playPreviousVideo();
        });
        
        // Handle right zone tap - go to next video
        rightZone.addEventListener('click', (e) => {
            e.stopPropagation();
            playNextVideo();
        });
        
        // Handle bottom zone tap - open main page in new tab
        bottomZone.addEventListener('click', (e) => {
            e.stopPropagation();
            window.open('/', '_blank');
        });
        
        // Handle center zone tap - toggle play/pause
        centerZone.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isPlaying) {
                videoPlayer.pause();
                pausedIndicator.style.display = 'flex';
                isPlaying = false;
            } else {
                videoPlayer.play();
                pausedIndicator.style.display = 'none';
                isPlaying = true;
            }
        });
        
        // Prevent context menu on long press (for touchscreens)
        videoContainer.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            return false;
        });
        
        // Handle visibility changes
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                videoPlayer.pause();
            } else if (isPlaying) {
                videoPlayer.play();
            }
        });
        
        // Ensure fullscreen-like experience
        function goFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }
        
        // Try to go fullscreen on first interaction
        let fullscreenAttempted = false;
        const attemptFullscreen = () => {
            if (!fullscreenAttempted) {
                goFullscreen();
                fullscreenAttempted = true;
            }
        };
        
        leftZone.addEventListener('click', attemptFullscreen, { once: true });
        rightZone.addEventListener('click', attemptFullscreen, { once: true });
        bottomZone.addEventListener('click', attemptFullscreen, { once: true });
        centerZone.addEventListener('click', attemptFullscreen, { once: true });
    </script>
</body>
</html>
