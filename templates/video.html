<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Loop Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        
        .tap-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 10;
        }
        
        .tap-zone-left {
            left: 0;
        }
        
        .tap-zone-right {
            right: 0;
        }
        
        .tap-zone-bottom {
            position: absolute;
            bottom: 0;
            left: 25%;
            right: 25%;
            height: 20%;
            z-index: 10;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            display: none;
        }
        
    </style>
</head>
<body>
    <div class="video-container" id="videoContainer">
        <div class="tap-zone tap-zone-left" id="leftZone"></div>
        <div class="tap-zone tap-zone-right" id="rightZone"></div>
        <div class="tap-zone tap-zone-bottom" id="bottomZone"></div>
        <video id="videoPlayer" autoplay></video>
        <div class="loading" id="loading">Loading...</div>
    </div>
    
    <script>
        const videos = [
            'https://res.cloudinary.com/dsbzveh0y/video/upload/v1758064168/1_mnpbuc.mp4',
            'https://res.cloudinary.com/dsbzveh0y/video/upload/v1758064165/2_mexsbf.mov',
            'https://res.cloudinary.com/dsbzveh0y/video/upload/v1758064164/4_cehsv0.mov',
            'https://res.cloudinary.com/dsbzveh0y/video/upload/v1758064163/3_r9pdtc.mov',
            'https://res.cloudinary.com/dsbzveh0y/video/upload/v1758064160/INFO_wrvcfd.mp4'
        ];
        
        let currentVideoIndex = 0;
        const videoPlayer = document.getElementById('videoPlayer');
        const videoContainer = document.getElementById('videoContainer');
        const loading = document.getElementById('loading');
        const leftZone = document.getElementById('leftZone');
        const rightZone = document.getElementById('rightZone');
        const bottomZone = document.getElementById('bottomZone');
        
        function loadVideo(index) {
            loading.style.display = 'block';
            videoPlayer.src = videos[index];
            videoPlayer.load();
        }
        
        function playNextVideo() {
            currentVideoIndex = (currentVideoIndex + 1) % videos.length;
            loadVideo(currentVideoIndex);
        }
        
        function playPreviousVideo() {
            currentVideoIndex = (currentVideoIndex - 1 + videos.length) % videos.length;
            loadVideo(currentVideoIndex);
        }
        
        // Initialize first video
        loadVideo(currentVideoIndex);
        
        // Handle video events
        videoPlayer.addEventListener('loadeddata', () => {
            loading.style.display = 'none';
            videoPlayer.play().catch(e => {
                console.error('Auto-play failed:', e);
                // If autoplay fails, wait for user interaction
            });
        });
        
        videoPlayer.addEventListener('ended', () => {
            playNextVideo();
        });
        
        videoPlayer.addEventListener('error', (e) => {
            console.error('Video error:', e);
            // Try next video on error
            playNextVideo();
        });
        
        // Handle left zone tap - go to previous video
        leftZone.addEventListener('click', (e) => {
            e.stopPropagation();
            playPreviousVideo();
        });
        
        // Handle right zone tap - go to next video
        rightZone.addEventListener('click', (e) => {
            e.stopPropagation();
            playNextVideo();
        });
        
        // Handle bottom zone tap - open main page in new tab
        bottomZone.addEventListener('click', (e) => {
            e.stopPropagation();
            window.open('/', '_blank');
        });
        
        // Prevent context menu on long press (for touchscreens)
        videoContainer.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            return false;
        });
        
        // Handle visibility changes
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                videoPlayer.pause();
            } else {
                videoPlayer.play();
            }
        });
        
        // Ensure fullscreen-like experience
        function goFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }
        
        // Try to go fullscreen on first interaction
        let fullscreenAttempted = false;
        const attemptFullscreen = () => {
            if (!fullscreenAttempted) {
                goFullscreen();
                fullscreenAttempted = true;
            }
        };
        
        leftZone.addEventListener('click', attemptFullscreen, { once: true });
        rightZone.addEventListener('click', attemptFullscreen, { once: true });
        bottomZone.addEventListener('click', attemptFullscreen, { once: true });
    </script>
</body>
</html>
