<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llamar - Sol by Emptor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #7B3FF2 0%, #4B1B8C 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .call-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 20px 32px;
            background: #7B3FF2;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            text-decoration: none;
        }

        .call-btn:hover:not(:disabled) {
            background: #6B2FE2;
            transform: scale(1.02);
        }

        .call-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .call-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .phone-icon {
            font-size: 24px;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            display: block;
            background: #4CAF50;
            color: white;
        }

        .status.error {
            display: block;
            background: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="callBtn" class="call-btn">
            <span class="phone-icon">📞</span>
            <span id="btnText">Llamar</span>
        </button>
        <div id="status" class="status"></div>
    </div>

    <script>
        const callBtn = document.getElementById('callBtn');
        const btnText = document.getElementById('btnText');
        const status = document.getElementById('status');

        callBtn.addEventListener('click', async () => {
            callBtn.disabled = true;
            btnText.textContent = 'Llamando...';
            status.className = 'status';
            status.style.display = 'none';

            try {
                const response = await fetch('/api/call-cl', {
                    method: 'POST'
                });
                const result = await response.json();

                if (result.success) {
                    status.className = 'status success';
                    status.textContent = '¡Llamada iniciada! Te llamaremos en unos segundos...';
                } else {
                    status.className = 'status error';
                    status.textContent = 'Error al iniciar la llamada. Intenta nuevamente.';
                }
            } catch (error) {
                status.className = 'status error';
                status.textContent = 'Error de conexión. Intenta nuevamente.';
            } finally {
                callBtn.disabled = false;
                btnText.textContent = 'Llamar';
            }
        });
    </script>
</body>
</html>
