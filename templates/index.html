
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol by Emptor - Conference Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #7B3FF2 0%, #4B1B8C 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        
        form {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 10px;
        }
        
        .logo h1 {
            font-size: 48px;
            color: #7B3FF2;
            margin-bottom: 10px;
        }
        
        .logo .tagline {
            color: #666;
            font-size: 16px;
        }
        
        .sol-mascot {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        textarea:focus {
            outline: none;
            border-color: #7B3FF2;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #7B3FF2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .submit-btn:hover {
            background: #6B2FE2;
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .success-message {
            display: none;
            padding: 20px;
            background: #4CAF50;
            color: white;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
        }
        
        .error-message {
            display: none;
            padding: 20px;
            background: #f44336;
            color: white;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
        </div>
        
        <form id="signupForm">
            <div>
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" name="name">
                </div>
                
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email">
                </div>
                
                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" name="phone" placeholder="+51 999 999 999">
                </div>
                
                <div class="form-group">
                    <label for="description">Descripción (opcional)</label>
                    <textarea id="description" name="description" placeholder="Cuéntanos sobre ti o tu empresa..."></textarea>
                </div>
            </div>
            
            
            <button type="submit" class="submit-btn">Registrarme</button>
            
            <div class="success-message" id="successMessage">
                ¡Registro exitoso! Sol te llamará en unos segundos...
            </div>
            
            <div class="error-message" id="errorMessage">
                Error al registrar. Por favor intenta nuevamente.
            </div>
        </form>
    </div>
    
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.querySelector('.submit-btn');
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Registrando...';
            
            const formData = new FormData(e.target);
            
            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const result = await response.json();
                    e.target.reset();
                    
                    successMsg.style.display = 'block';
                    errorMsg.style.display = 'none';
                    successMsg.textContent = '¡Registro exitoso! Sol te llamará en unos segundos...';
                    
                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 5000);
                } else {
                    throw new Error('Registration failed');
                }
            } catch (error) {
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
                
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 5000);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Registrarme';
            }
        });
    </script>
</body>
</html>
