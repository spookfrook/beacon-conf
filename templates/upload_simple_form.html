        <?php
        $success = $_GET['success'] ?? '';
        $error = $_GET['error'] ?? '';
        
        if ($success) {
            echo '<div class="message success">✓ Upload concluído com sucesso!</div>';
            echo '<a href="/" style="display: block; text-align: center; margin-top: 20px;">← Voltar ao início</a>';
        } else if ($error) {
            echo '<div class="message error">' . htmlspecialchars(urldecode($error)) . '</div>';
        }
        ?>
        
        <?php if (!$success): ?>
        <form action="/upload-file-form" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="token" value="">
            
            <p>Selecione sua planilha (CSV, XLS, XLSX):</p>
            <input type="file" name="file" required accept=".csv,.xls,.xlsx">
            
            <button type="submit">Enviar arquivo</button>
        </form>
        <?php endif; ?>
    </div>
    
    <script>
        // Set token from sessionStorage
        const token = sessionStorage.getItem('upload_token');
        if (!token) {
            window.location.href = '/';
        } else {
            document.querySelector('input[name="token"]').value = token;
        }
    </script>
</body>
